<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="CitySync favicon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B63F6"></stop>
      <stop offset="100%" stop-color="#16C2FF"></stop>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1FE3D2"></stop>
      <stop offset="100%" stop-color="#FFFFFF"></stop>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#bg)"></rect>

  <!-- City Blocks -->
  <g fill="#FFFFFF">
    <rect x="30" y="52" width="16" height="32" rx="3"></rect>
    <rect x="52" y="36" width="20" height="48" rx="4"></rect>
    <rect x="78" y="60" width="14" height="24" rx="3"></rect>
  </g>

  <!-- Windows -->
  <g fill="#E6F6FF" opacity="0.9">
    <rect x="56" y="42" width="6" height="6" rx="1"></rect>
    <rect x="56" y="52" width="6" height="6" rx="1"></rect>
    <rect x="56" y="62" width="6" height="6" rx="1"></rect>
  </g>

  <!-- Signal Wave -->
  <path d="M44 94c12-10 28-10 40 0" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"></path>

  <path d="M50 88c8-6 20-6 28 0" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" opacity="0.85"></path>
</svg>
