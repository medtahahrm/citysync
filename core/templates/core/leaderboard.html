{% extends "base.html" %}
{% block content %}

<div class="container mt-5">
  <h2 class="fw-bold text-center mb-4">🏆 Leaderboard</h2>

  <table class="table table-hover shadow-sm">
    <thead class="table-dark">
      <tr>
        <th>#</th>
        <th>Citizen</th>
        <th>Badge</th>
        <th>Points</th>
      </tr>
    </thead>
    <tbody>
      {% for c in citizens %}
      <tr>
        <td>{{ forloop.counter }}</td>
        <td>{{ c.user.username }}</td>
        <td>🎖️ {{ c.badge }}</td>
        <td><strong>{{ c.points }}</strong></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

{% endblock %}
