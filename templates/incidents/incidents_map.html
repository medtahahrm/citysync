{% extends "base.html" %}
{% block title %}Carte des incidents | CitySync{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
#map {
  height: 85vh;
  border-radius: 14px;
}
</style>
{% endblock %}

{% block content %}
<div class="container mt-4">
  <h2 class="fw-bold mb-3"><i class="fas fa-map"></i> Carte des incidents</h2>
  <div id="map"></div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const map = L.map("map").setView([31.7917, -7.0926], 6);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors",
  }).addTo(map);

  fetch("/api/incidents/")
    .then(res => res.json())
    .then(data => {

      data.forEach(inc => {
        const lat = inc.latitude;
        const lng = inc.longitude;
        const radius = inc.radius || 150;

        // Marker
        const marker = L.marker([lat, lng]).addTo(map);

        marker.bindPopup(`
          <b>${inc.title}</b><br>
          Zone impactée: ${radius} m
        `);

        // Circle
        L.circle([lat, lng], {
          radius: radius,
          color: "#dc3545",
          fillColor: "#dc3545",
          fillOpacity: 0.2,
        }).addTo(map);
      });

    })
    .catch(err => console.log("Error loading incidents:", err));

});
</script>
{% endblock %}
